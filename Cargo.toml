[package]
name = "audio-orbit"
default-run = "audio-orbit"
version = "0.10.4"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1.0"
cpal = "0.15"
directories = "5.0"
eframe = "0.31"
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
lofty = "0.24"
lucide-icons = "1.21"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.15"
rodio = { version = "0.19", features = ["symphonia-all"] }
rustfft = "6"
serde = { version = "1.0", features = ["derive"] }
semver = "1.0"
serde_json = "1.0"
shine-rs = "0.1.3"
zip = "2.2"
windows_sys = { package = "windows-sys", version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 2
